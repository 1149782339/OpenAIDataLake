server:
  port: ${SERVER_PORT:9109}
  tomcat:
    max-http-form-post-size: 1GB
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: s3-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datalake}
    username: ${DB_USER:datalake}
    password: ${DB_PASSWORD:datalake}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

lake:
  master-key: ${LAKE_MASTER_KEY:}
  max-upload-bytes: ${LAKE_MAX_UPLOAD_BYTES:1073741824}
