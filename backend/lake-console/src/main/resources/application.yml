server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        name: LAKE_SESSION
        http-only: true
        same-site: lax
        secure: ${LAKE_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: lake-console
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datalake}
    username: ${DB_USER:datalake}
    password: ${DB_PASSWORD:datalake}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

lake:
  master-key: ${LAKE_MASTER_KEY:}
  admin:
    username: ${LAKE_ADMIN_USERNAME:}
    password: ${LAKE_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${LAKE_CORS_ORIGINS:http://localhost:5173}
